<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthill</title>
<style>
  :root { --bg: #fbfbfb; --ink: #111; --dim: #8a8a8a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: var(--ink); user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  #ui { position: fixed; left: 16px; top: 14px; display: flex; flex-direction: column; gap: 6px; max-width: calc(100vw - 32px); }
  h1 { font-weight: 300; letter-spacing: .45em; font-size: 15px; margin: 0 0 4px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--dim); }
  .row label { display: flex; gap: 5px; align-items: center; }
  input[type=range] { width: 80px; accent-color: #111; }
  button, select { font: inherit; background: none; border: 1px solid #ccc; border-radius: 3px; padding: 2px 8px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: #111; }
  button.on { border-color: #111; background: #111; color: #fbfbfb; }
  #stat, #log { color: var(--dim); }
  #gallery { position: fixed; right: 12px; top: 12px; bottom: 34px; width: 268px; overflow-y: auto; display: none; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
  #gallery.show { display: grid; }
  #gallery div { position: relative; cursor: pointer; border: 1px solid #e4e4e4; border-radius: 3px; background: #fbfbfb; }
  #gallery div:hover { border-color: #111; }
  #gallery canvas { width: 100%; display: block; }
  #gallery span { position: absolute; left: 4px; bottom: 2px; font-size: 10px; color: var(--dim); }
  #breed { position: fixed; inset: 0; background: rgba(251,251,251,0.97); display: none; flex-direction: column; padding: 16px; gap: 10px; box-sizing: border-box; }
  #breed.show { display: flex; }
  #breed header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; color: var(--dim); }
  #breed header h2 { font-weight: 300; letter-spacing: .4em; font-size: 14px; margin: 0; color: var(--ink); }
  #brgrid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; min-height: 0; }
  @media (max-width: 700px) { #brgrid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); } }
  #brgrid .cand { position: relative; border: 1px solid #e2e2e2; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
  #brgrid .cand:hover { border-color: #888; }
  #brgrid .cand.sel { border: 2px solid rgb(255,32,32); }
  #brgrid canvas { max-width: 100%; max-height: 100%; aspect-ratio: 1; }
  #brgrid .tag { position: absolute; left: 6px; top: 4px; font-size: 11px; color: var(--dim); }
  #brgrid .open { position: absolute; right: 6px; top: 4px; font-size: 11px; padding: 0 6px; }
  #taste { color: var(--dim); }
  #hint { position: fixed; right: 16px; bottom: 12px; color: var(--dim); text-align: right; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>ANTHILL</h1>
  <div class="row">
    <label>fold <select id="fold"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>6</option></select></label>
    <label>food <input id="food" type="range" min="4" max="24" value="11"></label>
    <label>hilbert <input id="hil" type="range" min="0" max="3" value="2"></label>
    <label>ants <input id="ants" type="range" min="0" max="5000" step="1" value="2014"></label>
    <button id="reseed">reseed</button>
    <button id="evolve">evolve 64 on GPU</button>
    <button id="raid">raid 35</button>
    <button id="breedBtn">breed ✦</button>
  </div>
  <div class="row" id="layers">
    show <button data-l="biome">1 biome</button><button data-l="graph">2 graph</button><button data-l="terrain" class="on">3 terrain</button><button data-l="flow">4 flow</button><button data-l="ants" class="on">ants</button>
  </div>
  <div id="stat"></div>
  <div id="log"></div>
</div>
<div id="gallery"></div>
<div id="breed">
  <header><h2>BREED</h2><span id="brgen"></span><span>pick 1–3 you like · their children come next</span>
    <button id="brnext" disabled>next generation →</button><button id="brback">← back</button><button id="brreset">restart</button><button id="brclose">close</button></header>
  <div id="taste"></div>
  <div id="brgrid"></div>
</div>
<div id="hint">scroll to zoom · drag to pan · click to drop an intruder</div>
<script>
// =====================================================================
// Pipeline:  1 biome (food)  ->  2 nests at food centroids + curved trail graph
//            -> 3 terrain from ONE wall (lens, 2.4) and ONE box (0.86), in layers
//               that add, add-politely or carve  ->  4 grid solver: reachability,
//               repair, flow fields  ->  ants.  "evolve" scores many seeds at once
//               with a WebGPU distance relaxation and lets you pick.
// =====================================================================
const L = 2.4, BOX = 0.86, S = 160, TAU = Math.PI * 2, INK = "#111", BG = "#fbfbfb";
const $ = (id) => document.getElementById(id);
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = (...v) => { let h = 2166136261; for (const x of v) { h ^= x | 0; h = Math.imul(h, 16777619); h ^= h >>> 13; } return (h >>> 0) / 4294967296; };
const rot = (p, a) => [p[0] * Math.cos(a) - p[1] * Math.sin(a), p[0] * Math.sin(a) + p[1] * Math.cos(a)];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function d2xy(n, d) { let x = 0, y = 0, t = d; for (let s = 1; s < n; s *= 2) { const rx = 1 & (t / 2), ry = 1 & (t ^ rx); if (ry === 0) { if (rx === 1) { x = s - 1 - x; y = s - 1 - y; } const tmp = x; x = y; y = tmp; } x += s * rx; y += s * ry; t = Math.floor(t / 4); } return [x, y]; }
function segDist(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy; const t = l2 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2)) : 0; return Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t); }
function segSeg(a, b, c, d) { return Math.min(segDist(a, c, d), segDist(b, c, d), segDist(c, a, b), segDist(d, a, b), crosses(a, b, c, d) ? 0 : 1e9); }
function crosses(a, b, c, d) { const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0])); return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0; }

// ---------------------------------------------------------------- 3: elements
// Only two primitives exist. A wall is a lens of length L; a box is BOX wide.
class Terrain {
  constructor() { this.els = []; this.grid = new Map(); this.cs = 3; }
  key(x, y) { return (Math.floor(x / this.cs) + 1000) * 4096 + Math.floor(y / this.cs) + 1000; }
  near(x, y, r, fn) { const c = this.cs; for (let gx = Math.floor((x - r) / c); gx <= Math.floor((x + r) / c); gx++) for (let gy = Math.floor((y - r) / c); gy <= Math.floor((y + r) / c); gy++) { const b = this.grid.get((gx + 1000) * 4096 + gy + 1000); if (b) for (const e of b) if (e.alive) fn(e); } }
  ends(e) { const c = Math.cos(e.a) * L / 2, s = Math.sin(e.a) * L / 2; return [[e.x - c, e.y - s], [e.x + c, e.y + s]]; }
  overlaps(e, f) {
    if (e.t === "box" && f.t === "box") return Math.hypot(e.x - f.x, e.y - f.y) < BOX * 1.05;
    if (e.t === "wall" && f.t === "wall") {
      // tips may kiss; bodies may not cross
      const [a, b] = this.ends(e), [c, d] = this.ends(f), sh = (p, q, k) => [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];
      return segSeg(sh(a, b, 0.1), sh(b, a, 0.1), sh(c, d, 0.1), sh(d, c, 0.1)) < 0.26;
    }
    const w = e.t === "wall" ? e : f, bx = e.t === "box" ? e : f, [a, b] = this.ends(w);
    return segDist([bx.x, bx.y], a, b) < BOX * 0.5 + 0.14;
  }
  add(e, mode, layer) {
    // mode: "force" always lands; "polite" only where it overlaps nothing
    e.alive = true; e.layer = layer;
    if (mode === "polite") { let hit = false; this.near(e.x, e.y, L, (f) => { if (!hit && this.overlaps(e, f)) hit = true; }); if (hit) return false; }
    this.els.push(e);
    const k = this.key(e.x, e.y); let b = this.grid.get(k); if (!b) this.grid.set(k, (b = [])); b.push(e);
    return true;
  }
  wall(p, q, mode, layer) { return this.add({ t: "wall", x: (p[0] + q[0]) / 2, y: (p[1] + q[1]) / 2, a: Math.atan2(q[1] - p[1], q[0] - p[0]) }, mode, layer); }
  box(x, y, a, mode, layer) { return this.add({ t: "box", x, y, a }, mode, layer); }
  // carve: everything whose body comes within hw of the polyline goes
  carve(poly, hw) {
    for (let i = 0; i < poly.length; i++) this.near(poly[i][0], poly[i][1], hw + L, (e) => {
      const pts = e.t === "wall" ? [0.15, 0.5, 0.85].map((k) => { const [a, b] = this.ends(e); return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }) : [[e.x, e.y]];
      const r = e.t === "box" ? hw + BOX * 0.4 : hw;
      for (const p of pts) for (let j = Math.max(0, i - 1); j < Math.min(poly.length - 1, i + 1); j++) if (segDist(p, poly[j], poly[j + 1]) < r) { e.alive = false; return; }
    });
  }
  live() { return this.els.filter((e) => e.alive); }
}

// curves: a quadratic arc between nodes, sampled densely
function arc(a, b, bow, n = 48) { const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], l = dist(a, b), nx = -(b[1] - a[1]) / l, ny = (b[0] - a[0]) / l, c = [m[0] + nx * bow * l, m[1] + ny * bow * l]; const out = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; out.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]); } return out; }
function offsetPoly(P, d) { return P.map((p, i) => { const q = P[Math.min(P.length - 1, i + 1)], o = P[Math.max(0, i - 1)], dx = q[0] - o[0], dy = q[1] - o[1], l = Math.hypot(dx, dy) || 1; return [p[0] - (dy / l) * d, p[1] + (dx / l) * d]; }); }
function trim(P, r0, r1) { const a = P[0], b = P[P.length - 1]; return P.filter((p) => dist(p, a) > r0 && dist(p, b) > r1); }
// walk a polyline laying lenses whose chord is exactly L, tip to tip
function chordWalk(P, fn) {
  if (P.length < 2) return;
  let cur = P[0], i = 0;
  while (i < P.length - 1) {
    let j = i + 1;
    while (j < P.length && dist(cur, P[j]) < L) j++;
    if (j >= P.length) break;
    const a = P[j - 1], b = P[j];
    // solve |cur + (a + (b - a) t) ...| = L on segment a-b
    let lo = 0, hi = 1;
    for (let it = 0; it < 24; it++) { const m = (lo + hi) / 2, q = [a[0] + (b[0] - a[0]) * m, a[1] + (b[1] - a[1]) * m]; if (dist(cur, q) < L) lo = m; else hi = m; }
    const q = [a[0] + (b[0] - a[0]) * lo, a[1] + (b[1] - a[1]) * lo];
    fn(cur, q); cur = q; i = j - 1;
  }
}
// a ring of n lenses whose chords are exactly L
const ringR = (n) => L / (2 * Math.sin(Math.PI / n));
function ring(T, c, n, phase, mode, layer, skip) {
  const R = ringR(n);
  for (let k = 0; k < n; k++) { const a0 = phase + (k / n) * TAU, a1 = phase + ((k + 1) / n) * TAU; if (skip && skip(k)) continue; T.wall([c[0] + Math.cos(a0) * R, c[1] + Math.sin(a0) * R], [c[0] + Math.cos(a1) * R, c[1] + Math.sin(a1) * R], mode, layer); }
  return R;
}

// ---------------------------------------------------------------- genome
// Every knob of the pipeline is a gene with a range; the breeder walks this space.
const GENES = {
  fold: { min: 1, max: 6, int: true, label: "symmetry" },
  food: { min: 4, max: 24, int: true, label: "food patches" },
  hil: { min: 0, max: 3, int: true, label: "hilbert layers" },
  spread: { min: 7, max: 18, label: "food spacing" },
  reach: { min: 0.45, max: 1, label: "extent" },
  nestDiv: { min: 1.5, max: 6, label: "food per nest" },
  pull: { min: 0.45, max: 0.95, label: "nests toward food" },
  bow: { min: 0, max: 1.3, label: "trail curvature" },
  roads: { min: 0, max: 1, label: "ring roads" },
  hillRings: { min: 1, max: 4, int: true, label: "hill rings" },
  nestRings: { min: 1, max: 3, int: true, label: "nest rings" },
  width: { min: 0.75, max: 1.5, label: "trail width" },
  rake: { min: 0, max: 1, label: "raked stones" },
  garden: { min: 0.4, max: 2, label: "garden density" },
  hilR: { min: 0.6, max: 1.35, label: "hilbert radius" },
  hilOrder: { min: 2, max: 3, int: true, label: "hilbert depth" },
};
const FOLDS = [1, 2, 3, 4, 6];
function fixGenome(g) { const o = { ...g }; for (const [k, d] of Object.entries(GENES)) { if (o[k] === undefined) continue; o[k] = Math.max(d.min, Math.min(d.max, o[k])); if (d.int) o[k] = Math.round(o[k]); } if (o.fold !== undefined) o.fold = FOLDS.reduce((a, b) => (Math.abs(b - o.fold) < Math.abs(a - o.fold) ? b : a)); return o; }
const DEF = { spread: 11, reach: 1, nestDiv: 3, pull: 0.75, bow: 0.55, roads: 0.7, hillRings: 3, nestRings: 2, width: 1, rake: 1, garden: 1, hilR: 1, hilOrder: 3 };

// ---------------------------------------------------------------- the pipeline
function generate(seed, opt) {
  opt = { ...DEF, ...opt };
  const R = rng(seed), K = opt.fold, sec = TAU / K, log = [];
  const t0 = performance.now();
  // ---- 1. biome: food patches in one sector, Poisson-spaced, then the K copies
  const foodS = [];
  for (let tries = 0; foodS.length < Math.ceil(opt.food / Math.max(1, K / 2)) && tries < 4000; tries++) {
    const r = 14 + Math.sqrt(R()) * 60 * opt.reach, a = R() * sec, p = [Math.cos(a) * r, Math.sin(a) * r];
    const all = foodS.flatMap((f) => Array.from({ length: K }, (_, k) => rot(f.p, k * sec)));
    if (all.every((q) => dist(p, q) > opt.spread) && Array.from({ length: K }, (_, k) => rot(p, k * sec)).every((q, k) => k === 0 || dist(p, q) > opt.spread)) foodS.push({ p, rich: 0.3 + Math.pow(R(), 1.6) * 0.7 });
  }
  const food = []; for (let k = 0; k < K; k++) foodS.forEach((f, i) => food.push({ p: rot(f.p, k * sec), rich: f.rich, orb: i, k }));
  // ---- 2a. nests: weighted k-means on the sector's food (centroids of what they serve)
  const kn = Math.max(1, Math.round(foodS.length / opt.nestDiv));
  let cent = [...foodS].sort((a, b) => b.rich - a.rich).slice(0, kn).map((f) => [...f.p]);
  for (let it = 0; it < 12; it++) {
    const acc = cent.map(() => [0, 0, 0]);
    for (const f of foodS) { let b = 0; cent.forEach((c, i) => { if (dist(f.p, c) < dist(f.p, cent[b])) b = i; }); acc[b][0] += f.p[0] * f.rich; acc[b][1] += f.p[1] * f.rich; acc[b][2] += f.rich; }
    cent = cent.map((c, i) => (acc[i][2] ? [acc[i][0] / acc[i][2], acc[i][1] / acc[i][2]] : c));
  }
  // nests sit between their food and the hill: pull them 25% inward
  cent = cent.map((c) => [c[0] * opt.pull, c[1] * opt.pull]).filter((c) => Math.hypot(...c) > 14);
  const nests = [{ p: [0, 0], hill: true, rich: 1, orb: -1, k: 0 }];
  for (let k = 0; k < K; k++) cent.forEach((c, i) => nests.push({ p: rot(c, k * sec), rich: 0.6, orb: i, k }));
  // ---- 2b. graph: tree to the hill, ring roads between copies, food to its nest; all as arcs
  const edges = [];
  const sectorEdge = (a, b, kind, id) => { for (let k = 0; k < K; k++) edges.push({ a: rot(a, k * sec), b: rot(b, k * sec), kind, bow: (hash(seed, id, 7) - 0.5) * opt.bow }); };
  cent.forEach((c, i) => {
    // parent: the nearest node clearly closer to the hill
    let best = [0, 0], bd = Math.hypot(...c);
    for (let k = 0; k < K; k++) cent.forEach((d, j) => { const q = rot(d, k * sec); if (Math.hypot(...q) < Math.hypot(...c) - 6 && dist(q, c) < bd) { bd = dist(q, c); best = q; } });
    sectorEdge(best, c, "trunk", i);
    if (K > 1 && hash(seed, i, 3) < opt.roads) { const q = rot(c, sec); if (dist(q, c) < 55) sectorEdge(c, q, "ring", 100 + i); }
  });
  foodS.forEach((f, i) => { let best = [0, 0], bd = Math.hypot(...f.p); for (let k = 0; k < K; k++) cent.forEach((d) => { const q = rot(d, k * sec); if (dist(q, f.p) < bd) { bd = dist(q, f.p); best = q; } }); sectorEdge(best, f.p, "twig", 200 + i); });
  for (const e of edges) e.poly = arc(e.a, e.b, e.bow);
  log.push(`biome ${food.length} patches · ${nests.length - 1} nests · ${edges.length} trails`);

  // ---- 3. terrain, layer by layer
  const T = new Terrain();
  const nodeR = new Map();
  // 3a mandalas at the hill and nests (force): rings of exactly-L lenses, box rosettes
  const hillRings = Array.from({ length: opt.hillRings }, (_, i) => 8 * (i + 1));
  let hr = 0; hillRings.forEach((n, i) => { hr = ring(T, [0, 0], n, (i % 2) * Math.PI / n, "force", "mandala"); });
  for (let k = 0; k < 8; k++) { const a = k * TAU / 8 + TAU / 16; T.wall([Math.cos(a) * 0.6, Math.sin(a) * 0.6], [Math.cos(a) * (0.6 + L), Math.sin(a) * (0.6 + L)], "force", "mandala"); }
  T.box(0, 0, Math.PI / 4, "force", "mandala");
  nodeR.set("0,0", hr);
  for (const n of nests.slice(1)) {
    const rr = Array.from({ length: opt.nestRings }, (_, i) => 6 * (i + 1)), phase = Math.atan2(n.p[1], n.p[0]);
    let r = 0; rr.forEach((m, i) => { r = ring(T, n.p, m, phase + (i % 2) * Math.PI / m, "force", "mandala"); });
    // box rosette between the rings
    const rb = rr.length > 1 ? (ringR(6) + ringR(12)) / 2 : ringR(6) + 1.1, nb = Math.floor((TAU * rb) / 1.55);
    for (let j = 0; j < nb; j++) { const a = phase + (j / nb) * TAU; T.box(n.p[0] + Math.cos(a) * rb, n.p[1] + Math.sin(a) * rb, a, "polite", "mandala"); }
    nodeR.set(n.p.join(","), r);
  }
  // 3b recursive Hilbert overlays (polite): one patch per sector per level, facing the hill
  const hil = [];
  for (let lv = 0; lv < opt.hil; lv++) {
    const order = lv === 0 ? opt.hilOrder : 2, n = 1 << order, cell = lv === 0 ? 2 * L : L, side = n * cell;
    const rr = (lv === 0 ? 34 : lv === 1 ? 58 : 20) * opt.hilR, a0 = sec * (0.5 + 0.17 * lv) + hash(seed, lv) * 0.2;
    for (let k = 0; k < K; k++) {
      const a = a0 + k * sec, c = [Math.cos(a) * rr, Math.sin(a) * rr], u = [-Math.sin(a), Math.cos(a)], v = [Math.cos(a), Math.sin(a)];
      const P = (x, y) => [c[0] + (x - n / 2) * cell * u[0] + (y - n / 2) * cell * v[0], c[1] + (x - n / 2) * cell * u[1] + (y - n / 2) * cell * v[1]];
      const path = []; for (let d = 0; d < n * n; d++) path.push(d2xy(n, d));
      const open = new Set(); const kk = (p, q) => (p[0] * 64 + p[1] < q[0] * 64 + q[1] ? `${p}|${q}` : `${q}|${p}`);
      for (let d = 1; d < path.length; d++) open.add(kk(path[d - 1], path[d]));
      const steps = cell / L; // an edge of the patch lattice is 1 or 2 lenses
      const edgeWall = (x0, y0, x1, y1) => { for (let s = 0; s < steps; s++) { const p = P(x0 + ((x1 - x0) * s) / steps, y0 + ((y1 - y0) * s) / steps), q = P(x0 + ((x1 - x0) * (s + 1)) / steps, y0 + ((y1 - y0) * (s + 1)) / steps); T.wall(p, q, "polite", "hilbert" + lv); } };
      for (let x = 0; x <= n; x++) for (let y = 0; y < n; y++) { const inner = x > 0 && x < n && open.has(kk([x - 1, y], [x, y])); const door = (x === 0 && y === 0) || (x === n && y === 0); if (!inner && !door) edgeWall(x, y, x, y + 1); }

// ---------------------------------------------------------------- GPU batch evaluation
// Many seeds generated on the CPU, rasterised coarse, then ONE compute shader relaxes
// all their distance fields in parallel (z = environment). Score: food reachable,
// path tortuosity near a target, and openness. Click a thumbnail to load it.
const GB = 256;
const WGSL = `
@group(0) @binding(0) var<storage, read> occ: array<u32>;
@group(0) @binding(1) var<storage, read> src: array<u32>;

@compute @workgroup_size(8, 8, 1) fn main(@builtin(global_invocation_id) id: vec3u) {

    if (x + 1u < G) { d = min(d, src[i + 1u] + 1u); }
    if (y > 0u) { d = min(d, src[i - G] + 1u); }

let gpu = null;
async function gpuInit() {

}
async function relaxAll(occs, B, iters) {

    return occs.map((o, b) => { const oo = occ.subarray(b * GB * GB, (b + 1) * GB * GB); const D = bfs(Uint8Array.from(oo), GB, discCells(GB, [0, 0], 1.0)); return Uint32Array.from(D, (v) => (v === 65535 ? INF : v)); });

$("evolve").addEventListener("click", async () => {
  const B = 64, base = (seed * 69069 + 1) % 2147483647, gal = $("gallery");
  gal.classList.add("show"); gal.innerHTML = ""; $("log").textContent = `generating ${B} worlds…`;
  await new Promise((r) => setTimeout(r, 20));
  const t0 = performance.now(), worlds = [], occs = [];
  for (let b = 0; b < B; b++) { const w = generate(base + b * 7919, opts()); worlds.push(w); occs.push(raster(w.T, GB)); }
  const tg = performance.now();
  const ds = await relaxAll(occs, B, 1500);
  const tr = performance.now();
  const INF = 0x3fffffff, cell = S / GB;
  const scored = worlds.map((w, b) => {
    const D = ds[b]; let reach = 0, tort = 0;
    for (const f of w.food) { const cs2 = discCells(GB, f.p, 2.2); const d = Math.min(...cs2.map((c) => D[c])); if (d < INF) { reach++; tort += (d * cell) / Math.max(1, Math.hypot(...f.p)); } }
    const open = occs[b].reduce((a, v) => a + (1 - v), 0) / (GB * GB);
    const tor = reach ? tort / reach : 0;
    const score = (reach / w.food.length) * 70 + Math.max(0, 20 - Math.abs(tor - 1.8) * 14) + Math.max(0, 10 - Math.abs(open - 0.78) * 60);
    return { w, score, reach: reach / w.food.length, tor, open };
  }).sort((a, b) => b.score - a.score);
  $("log").textContent = `${B} worlds: generated in ${(tg - t0) | 0} ms on the CPU, ${B} distance fields relaxed in parallel in ${(tr - tg) | 0} ms on ${gpu ? "the GPU" : "the CPU (no WebGPU)"} · click one to load`;
  for (const s of scored) {
    const d = document.createElement("div"), c = document.createElement("canvas"); c.width = 240; c.height = 240;
    const x = c.getContext("2d"); x.translate(120, 120); x.scale(240 / S, -240 / S); drawTerrain(x, s.w.T, S / 240, false);
    d.append(c); const sp = document.createElement("span"); sp.textContent = `${s.score.toFixed(0)} · reach ${(s.reach * 100) | 0}% · tort ${s.tor.toFixed(2)}`; d.append(sp);
    d.addEventListener("click", () => load(s.w.seed)); gal.append(d);
  }
});
// ---------------------------------------------------------------- breeder (Picbreeder-style)
// Eight heavily distinct worlds at a time. You keep 1-3; the next eight are their
// children, each made by a named action (a step along one direction of the space)
// plus crossover and noise. Two things are learned from your picks: a taste vector
// over genes, and which actions tend to make things you keep. Every candidate is
// solved on the GPU first; dead worlds never reach you.
const KEYS = Object.keys(GENES);
const nrm = (g) => KEYS.map((k) => (g[k] - GENES[k].min) / (GENES[k].max - GENES[k].min));
const ACTIONS = {
  twist: (g, R) => (g.bow += 0.35 + R() * 0.3),
  straighten: (g) => (g.bow *= 0.3),
  refold: (g, R) => (g.fold = FOLDS[(FOLDS.indexOf(g.fold) + (R() < 0.5 ? 1 : FOLDS.length - 1)) % FOLDS.length]),
  "grow rings": (g) => { g.hillRings += 1; g.nestRings += 1; },
  "prune rings": (g) => { g.hillRings -= 1; g.nestRings -= 1; },
  widen: (g) => (g.width += 0.3),
  narrow: (g) => (g.width -= 0.25),
  "deepen hilbert": (g) => { g.hil += 1; g.hilOrder += 1; },
  "lift hilbert": (g) => (g.hil -= 1),
  scatter: (g) => { g.spread += 3; g.food += 3; },
  cluster: (g) => { g.spread -= 3; g.nestDiv += 1; },
  rewire: (g, R, c) => (c.seed = Math.floor(R() * 2147483647)),
  garden: (g) => { g.garden *= 1.5; g.rake += 0.4; },
  bare: (g) => { g.garden *= 0.6; g.rake -= 0.5; },
  expand: (g) => { g.reach += 0.2; g.hilR += 0.15; },
  contract: (g) => { g.reach -= 0.2; g.pull -= 0.1; },
  "ring roads": (g) => (g.roads += 0.45),
  "nests outward": (g) => (g.pull += 0.15),
};
const BR = { gen: 0, pop: [], sel: new Set(), taste: KEYS.map(() => 0), act: Object.fromEntries(Object.keys(ACTIONS).map((a) => [a, 1])), hist: [], R: rng(777) };
function descriptor(w) { const n = 12, h = new Float32Array(n * n); for (const e of w.T.live()) { const gx = Math.min(n - 1, Math.max(0, Math.floor(((e.x + S / 2) / S) * n))), gy = Math.min(n - 1, Math.max(0, Math.floor(((e.y + S / 2) / S) * n))); h[gy * n + gx] += e.t === "box" ? 0.6 : 1; } const m = Math.max(1, ...h); return h.map((v) => v / m); }
function cdist(a, b) { const ga = nrm(a.g), gb = nrm(b.g); let s1 = 0, s2 = 0; ga.forEach((v, i) => (s1 += (v - gb[i]) ** 2)); a.d.forEach((v, i) => (s2 += (v - b.d[i]) ** 2)); return Math.sqrt(s1 / KEYS.length) * 0.5 + Math.sqrt(s2 / a.d.length) * 1.5; }
function randomCand(R) { const g = {}; for (const k of KEYS) g[k] = GENES[k].min + R() * (GENES[k].max - GENES[k].min); return { g: fixGenome(g), seed: Math.floor(R() * 2147483647), action: "origin" }; }
function child(parents, R) {
  const a = parents[Math.floor(R() * parents.length)];
  let g = { ...a.g }, seed = a.seed, label = [];
  if (parents.length > 1 && R() < 0.45) { const b = parents.filter((p) => p !== a)[Math.floor(R() * (parents.length - 1))]; for (const k of KEYS) if (R() < 0.5) g[k] = b.g[k]; if (R() < 0.5) seed = b.seed; label.push("cross"); }
  // drift along the learned taste, plus a little noise on a few genes
  KEYS.forEach((k, i) => { const span = GENES[k].max - GENES[k].min; g[k] += BR.taste[i] * span * 0.35 * R(); });
  for (let n = 0; n < 2; n++) { const k = KEYS[Math.floor(R() * KEYS.length)], span = GENES[k].max - GENES[k].min; g[k] += (R() - 0.5) * span * 0.18; }
  // one named action, chosen by how often it has produced keepers
  const names = Object.keys(ACTIONS), tot = names.reduce((s2, n) => s2 + BR.act[n], 0);
  let pick = R() * tot, act = names[0]; for (const n of names) { pick -= BR.act[n]; if (pick <= 0) { act = n; break; } }
  const c = { seed };

async function breedRound(parents) {
  const R = BR.R, N = 40;
  $("brgen").textContent = `generation ${BR.gen} · breeding…`;
  await new Promise((r) => setTimeout(r, 20));
  const cands = [];
  for (let i = 0; i < N; i++) { const c = parents.length ? child(parents, R) : randomCand(R); c.w = generate(c.seed, c.g); c.d = descriptor(c.w); cands.push(c); }

  const ds = await relaxAll(cands.map((c) => raster(c.w.T, GB)), cands.length, 1500);
  cands.forEach((c, b) => { let ok = 0; for (const f of c.w.food) if (Math.min(...discCells(GB, f.p, 2.2).map((x) => ds[b][x])) < 0x3fffffff) ok++; c.reach = ok / c.w.food.length; });

  const taste = (c) => nrm(c.g).reduce((s2, v, i) => s2 + v * BR.taste[i], 0);
  const out = [pool.reduce((a, b) => (taste(b) > taste(a) ? b : a))];
  while (out.length < 8 && out.length < pool.length) {
    let best = null, bs = -1;
    for (const c of pool) { if (out.includes(c)) continue; const md = Math.min(...out.map((o) => cdist(c, o))); if (md > bs) { bs = md; best = c; } }

}
function renderBreed() {
  const grid = $("brgrid"); grid.innerHTML = "";
  $("brgen").textContent = `generation ${BR.gen}`;
  BR.pop.forEach((c, i) => {
    const d = document.createElement("div"); d.className = "cand" + (BR.sel.has(i) ? " sel" : "");
    const cvs = document.createElement("canvas"); cvs.width = cvs.height = 420;
    const x = cvs.getContext("2d"); x.fillStyle = BG; x.fillRect(0, 0, 420, 420); x.translate(210, 210); x.scale(420 / S, -420 / S); drawTerrain(x, c.w.T, S / 420, false);
    d.append(cvs);
    const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = `${c.action} · ${c.g.fold}-fold · reach ${(c.reach * 100) | 0}%`; d.append(tag);
    const op = document.createElement("button"); op.className = "open"; op.textContent = "walk in"; op.onclick = (e) => { e.stopPropagation(); $("breed").classList.remove("show"); load(c.seed, true, c.g); }; d.append(op);
    d.onclick = () => { if (BR.sel.has(i)) BR.sel.delete(i); else if (BR.sel.size < 3) BR.sel.add(i); renderBreed(); };
    grid.append(d);

  const acts = Object.entries(BR.act).sort((a, b) => b[1] - a[1]).slice(0, 3).map((a) => a[0]);
  $("taste").textContent = BR.gen === 0 ? "learning your taste…" : `taste: ${top.map(([k, v]) => `${v > 0 ? "more" : "less"} ${GENES[k].label}`).join(", ") || "still neutral"} · favoured actions: ${acts.join(", ")}`;
}
$("brnext").onclick = async () => {
  const sel = [...BR.sel].map((i) => BR.pop[i]);
  // taste: kept minus shown, in normalised gene space, with memory
  const mean = (cs) => KEYS.map((_, i) => cs.reduce((s2, c) => s2 + nrm(c.g)[i], 0) / cs.length);
  const ms = mean(sel), ma = mean(BR.pop);
  BR.taste = BR.taste.map((t, i) => 0.6 * t + 0.4 * (ms[i] - ma[i]));

  for (const c of BR.pop) for (const a of c.action.split(" + ")) if (BR.act[a] !== undefined) BR.act[a] = Math.max(0.2, BR.act[a] + (sel.includes(c) ? 1 : -0.25));

$("brback").onclick = () => { if (!BR.hist.length) return; BR.pop = BR.hist.pop(); BR.gen--; BR.sel.clear(); renderBreed(); };
$("brreset").onclick = async () => { BR.gen = 0; BR.hist = []; BR.taste = KEYS.map(() => 0); for (const a in BR.act) BR.act[a] = 1; await breedRound([]); };
$("brclose").onclick = () => $("breed").classList.remove("show");
$("breedBtn").onclick = async () => { $("breed").classList.add("show"); if (!BR.pop.length) await breedRound([]); else renderBreed(); };
