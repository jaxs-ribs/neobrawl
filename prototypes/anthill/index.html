<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthill</title>
<style>
  :root { --bg: #fbfbfb; --ink: #111; --dim: #8a8a8a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: var(--ink); user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  #ui { position: fixed; left: 16px; top: 14px; display: flex; flex-direction: column; gap: 6px; max-width: calc(100vw - 32px); pointer-events: none; }
  #ui > * { pointer-events: auto; width: fit-content; }
  h1 { font-weight: 300; letter-spacing: .45em; font-size: 15px; margin: 0 0 4px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--dim); }
  .row label { display: flex; gap: 5px; align-items: center; }
  input[type=range] { width: 80px; accent-color: #111; }
  button, select { font: inherit; background: none; border: 1px solid #ccc; border-radius: 3px; padding: 2px 8px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: #111; }
  #stat { color: var(--dim); }
  #breed { position: fixed; inset: 0; background: rgba(251,251,251,0.97); display: none; flex-direction: column; padding: 16px; gap: 10px; box-sizing: border-box; }
  #breed.show { display: flex; }
  #breed header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; color: var(--dim); }
  #breed header h2 { font-weight: 300; letter-spacing: .4em; font-size: 14px; margin: 0; color: var(--ink); }
  #brgrid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; min-height: 0; }
  @media (max-width: 700px) { #brgrid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); } }
  #brgrid .cand { position: relative; border: 1px solid #e2e2e2; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
  #brgrid .cand:hover { border-color: #888; }
  #brgrid .cand.sel { border: 2px solid rgb(255,32,32); }
  #brgrid canvas { max-width: 100%; max-height: 100%; aspect-ratio: 1; }
  #brgrid .tag { position: absolute; left: 6px; top: 4px; font-size: 11px; color: var(--dim); }
  #brgrid .open { position: absolute; right: 6px; top: 4px; font-size: 11px; padding: 0 6px; }
  #taste { color: var(--dim); }
  #hint { position: fixed; right: 16px; bottom: 12px; color: var(--dim); text-align: right; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>ANTHILL</h1>
  <div class="row">
    <label>scale <select id="scale"><option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option><option value="32">32×</option></select></label>
    <label>ants / city <input id="ants" type="range" min="0" max="2014" step="1" value="700"></label>
    <button id="reseed">reseed</button><button id="raid">raid 35</button><button id="breedBtn">breed ✦</button>
  </div>
  <div id="stat"></div>
</div>
<div id="breed">
  <header><h2>BREED</h2><span id="brgen"></span><span>pick 1–3 you like · their children come next</span>
    <button id="brnext" disabled>next generation →</button><button id="brback">← back</button><button id="brreset">restart</button><button id="brclose">close</button></header>
  <div id="taste"></div>
  <div id="brgrid"></div>
</div>
<div id="hint">scroll to zoom · drag to pan · click to drop an intruder</div>
<script src="gen.js"></script>
<script>
"use strict";
// =====================================================================
// A realm of cities. The worker builds; this page only draws and runs the
// cities you are looking at. Drawing is a tile pyramid: each tile is rendered
// once, at the detail its zoom needs, inside a strict per-frame time budget,
// with coarser tiles standing in until finer ones are ready.
// =====================================================================
const $ = (id) => document.getElementById(id), INK = "#111", BG = "#fbfbfb";
const cv = $("c"), g = cv.getContext("2d");
let VW = 0, VH = 0, dpr = 1;
const view = { x: 0, y: 0, s: 2 };
const worker = new Worker("worker.js");
let ver = 0, realmState = null, baseGenome = { ...DEF }, capitalSeed = 20141, scale = 4;
const sources = []; // drawable element sets: { x0, y0, x1, y1, walls, boxes, buckets }
let roadsSrc = null;

// ---------------------------------------------------------------- spatial buckets per source
const BS = 40;
function bucketize(walls, boxes) {
  const m = new Map(), put = (k, kind, i) => { let b = m.get(k); if (!b) m.set(k, (b = { w: [], b: [] })); b[kind].push(i); };
  for (let i = 0; i < walls.length; i += 3) put(Math.floor(walls[i] / BS) * 65536 + Math.floor(walls[i + 1] / BS), "w", i);
  for (let i = 0; i < boxes.length; i += 3) put(Math.floor(boxes[i] / BS) * 65536 + Math.floor(boxes[i + 1] / BS), "b", i);
  return m;
}
function eachIn(src, x0, y0, x1, y1, fw, fb) {
  for (let bx = Math.floor((x0 - L) / BS); bx <= Math.floor((x1 + L) / BS); bx++) for (let by = Math.floor((y0 - L) / BS); by <= Math.floor((y1 + L) / BS); by++) {
    const b = src.buckets.get(bx * 65536 + by); if (!b) continue;
    if (fw) for (const i of b.w) fw(src.walls, i);
    if (fb) for (const i of b.b) fb(src.boxes, i);
  }
}

// ---------------------------------------------------------------- tiles
const TS0 = 20, TCSS = 256;
const tiles = new Map(); // key -> canvas (LRU by insertion order)
const tkey = (l, x, y) => `${l}|${x}|${y}`;
function levelFor(s) { return Math.max(0, Math.min(14, Math.round(Math.log2(TCSS / (TS0 * s))))); }
function invalidate(x0, y0, x1, y1) { for (const k of [...tiles.keys()]) { const [l, tx, ty] = k.split("|").map(Number), ts = TS0 * 2 ** l; if ((tx + 1) * ts >= x0 && tx * ts <= x1 && (ty + 1) * ts >= y0 && ty * ts <= y1) tiles.delete(k); } }
function lensPath(ctx, x, y, a) { const c = Math.cos(a) * L / 2, s = Math.sin(a) * L / 2, k = L * 0.105, nx = -Math.sin(a) * k, ny = Math.cos(a) * k; ctx.moveTo(x - c, y - s); ctx.quadraticCurveTo(x + nx, y + ny, x + c, y + s); ctx.quadraticCurveTo(x - nx, y - ny, x - c, y - s); }

function renderTile(l, tx, ty) {
  const ts = TS0 * 2 ** l, px = Math.round(TCSS * Math.min(2, dpr)), c = document.createElement("canvas"); c.width = c.height = px;
  const ctx = c.getContext("2d"), x0 = tx * ts, y0 = ty * ts, x1 = x0 + ts, y1 = y0 + ts, k = px / ts;
  ctx.setTransform(k, 0, 0, -k, -x0 * k, y1 * k);
  const upx = 1 / k, lensCss = (L * TCSS) / ts;
  const hit = sources.filter((s) => s.x1 >= x0 - L && s.x0 <= x1 + L && s.y1 >= y0 - L && s.y0 <= y1 + L);
  if (lensCss >= 6) {
    // near: the real shapes, with their soft offset shadow
    const fill = (style) => { ctx.beginPath(); for (const s of hit) eachIn(s, x0, y0, x1, y1, (w, i) => lensPath(ctx, w[i], w[i + 1], w[i + 2]), (b, i) => boxPath(ctx, b[i], b[i + 1], b[i + 2])); ctx.fillStyle = style; ctx.fill("evenodd"); };
    ctx.save(); ctx.translate(0.07, -0.07); ctx.filter = `blur(${Math.max(0.5, (0.06 * k) / Math.min(2, dpr))}px)`; fill("rgba(0,0,0,0.16)"); ctx.restore(); ctx.filter = "none";
    fill(INK);
  } else if (ts <= 320) {
    // mid: hairlines and specks
    ctx.lineWidth = Math.max(upx * 1.1, 0.2); ctx.strokeStyle = INK; ctx.beginPath();
    for (const s of hit) eachIn(s, x0, y0, x1, y1, (w, i) => { const c2 = (Math.cos(w[i + 2]) * L) / 2, s2 = (Math.sin(w[i + 2]) * L) / 2; ctx.moveTo(w[i] - c2, w[i + 1] - s2); ctx.lineTo(w[i] + c2, w[i + 1] + s2); }, null);
    ctx.stroke(); ctx.fillStyle = INK; ctx.beginPath(); const h = Math.max(0.38, upx * 0.7);
    for (const s of hit) eachIn(s, x0, y0, x1, y1, null, (b, i) => ctx.rect(b[i] - h, b[i + 1] - h, 2 * h, 2 * h));
    ctx.fill();
  } else if (realmState) {
    // far: each city as its prebuilt thumbnail, highways as single lines
    ctx.lineWidth = Math.max(upx, 2); ctx.strokeStyle = "rgba(17,17,17,0.55)"; ctx.beginPath();
    for (const r of realmState.roads) { if (r.x1 < x0 || r.x0 > x1 || r.y1 < y0 || r.y0 > y1) continue; const p = r.poly; ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); }
    ctx.stroke();
    for (const hb of realmState.hubs) {
      if (hb.x + 80 < x0 || hb.x - 80 > x1 || hb.y + 80 < y0 || hb.y - 80 > y1) continue;
      if (hb.city && hb.city.thumb) { ctx.save(); ctx.translate(hb.x - 80, hb.y + 80); ctx.scale(1, -1); ctx.drawImage(hb.city.thumb, 0, 0, 160, 160); ctx.restore(); }
      else { ctx.lineWidth = Math.max(upx, 1.5); ctx.strokeStyle = "rgba(17,17,17,0.35)"; ctx.beginPath(); ctx.arc(hb.x, hb.y, 30, 0, TAU); ctx.stroke(); }
    }

}
function tileOrParent(l, tx, ty) {
  for (let k = 0; k <= 6; k++) {
    const key = tkey(l + k, tx >> k, ty >> k), c = tiles.get(key);
    if (c) { if (k === 0) { tiles.delete(key); tiles.set(key, c); } return { c, k, ox: tx - ((tx >> k) << k), oy: ty - ((ty >> k) << k) }; }
  }
  return null;
}

// ---------------------------------------------------------------- realm, cities
let pending = 0;
function rebuild() {
  ver++; tiles.clear(); sources.length = 0; roadsSrc = null; realmState = null; caravans = null; active = []; pending = 0;
  scale = +$("scale").value;
  worker.postMessage({ type: "realm", ver, seed: capitalSeed, scale });
}
function requestCities() {
  if (!realmState || pending >= 2) return;
  // the nearest unbuilt city to where you are looking goes first
  let best = null, bd = 1e18;
  for (const h of realmState.hubs) if (!h.req) { const d = (h.x - view.x) ** 2 + (h.y - view.y) ** 2; if (d < bd) { bd = d; best = h; } }
  if (!best) return;
  best.req = true; pending++;
  const capital = best.biome < 0, genome = capital ? baseGenome : cityGenome(baseGenome, best.h, best.biome);
  worker.postMessage({ type: "city", ver, id: best.id, seed: capital ? capitalSeed : best.h >>> 0, genome, exits: best.exits });
}
worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === "breed") return onBreed(m);
  if (m.ver !== ver) return;
  if (m.type === "realm") {
    realmState = { Rw: m.Rw, hubs: m.hubs.map((h, i) => ({ ...h, id: i })), roads: m.roads.map((r) => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (let i = 0; i < r.poly.length; i += 2) { x0 = Math.min(x0, r.poly[i]); x1 = Math.max(x1, r.poly[i]); y0 = Math.min(y0, r.poly[i + 1]); y1 = Math.max(y1, r.poly[i + 1]); } return { ...r, x0, y0, x1, y1 }; }) };
    buildCaravans(); fitView();
  } else if (m.type === "roads") {
    roadsSrc = { x0: -1e9, y0: -1e9, x1: 1e9, y1: 1e9, walls: m.walls, boxes: m.boxes, buckets: bucketize(m.walls, m.boxes) };
    sources.push(roadsSrc); tiles.clear();
  } else if (m.type === "city") {
    pending--;
    const h = realmState.hubs[m.id];
    const loc = { walls: m.walls.slice(), boxes: m.boxes.slice() };
    for (const arr of [m.walls, m.boxes]) for (let i = 0; i < arr.length; i += 3) { arr[i] += h.x; arr[i + 1] += h.y; }
    const src = { x0: h.x - 80, y0: h.y - 80, x1: h.x + 80, y1: h.y + 80, walls: m.walls, boxes: m.boxes, buckets: bucketize(m.walls, m.boxes) };
    sources.push(src);
    h.city = { thumb: m.thumb, foods: m.foods, occ: m.occ, D: m.D, G: m.G, fields: null, ants: null, heat: null, pieces: (m.walls.length + m.boxes.length) / 3 };
    if (!m.thumb) { const t = document.createElement("canvas"); t.width = t.height = 256; const x = t.getContext("2d"); x.translate(128, 128); x.scale(256 / CITY, -256 / CITY); drawHair(x, loc.walls, loc.boxes, CITY / 256); h.city.thumb = t; }
    invalidate(src.x0, src.y0, src.x1, src.y1);
  } else if (m.type === "fields") {
    const h = realmState.hubs[m.id]; if (!h || !h.city) return;
    h.city.fields = m.fields; h.city.fieldReq = false;
  }
};

// ---------------------------------------------------------------- ants (only in the cities you watch)
const MAX_ACTIVE_ANTS = 4000;
let active = [], activeAt = 0, flashes = [];
function chooseActive(now) {
  if (!realmState || now - activeAt < 400) return; activeAt = now;
  const per = +$("ants").value, cap = Math.max(1, Math.min(4, Math.floor(MAX_ACTIVE_ANTS / Math.max(1, per))));
  const vis = view.s >= 1.2 ? realmState.hubs.filter((h) => h.city && Math.abs(h.x - view.x) < VW / 2 / view.s + 80 && Math.abs(h.y - view.y) < VH / 2 / view.s + 80) : [];
  vis.sort((a, b) => (a.x - view.x) ** 2 + (a.y - view.y) ** 2 - ((b.x - view.x) ** 2 + (b.y - view.y) ** 2));
  active = vis.slice(0, cap);
  for (const h of active) {
    const c = h.city; c.seen = now;
    if (!c.fields && !c.fieldReq) { c.fieldReq = true; worker.postMessage({ type: "fields", ver, id: h.id }); }
    if (c.fields && !c.ants) startAnts(h, per);
  }
  // cities long out of sight give their flow fields back
  for (const h of realmState.hubs) if (h.city && h.city.fields && !active.includes(h) && now - h.city.seen > 20000) { h.city.fields = null; h.city.ants = null; h.city.heat = null; }
}
function foodList(c) { if (!c.food) { c.food = []; for (let i = 0; i < c.foods.length; i += 3) c.food.push({ p: [c.foods[i], c.foods[i + 1]], rich: c.foods[i + 2], amt: Math.round(6 + c.foods[i + 2] * 10), i: i / 3 }); } return c.food; }
function pickFood(c) { const F = foodList(c), pool = F.filter((f) => f.amt > 0 && c.D[cellOf(c.G, ...f.p)] < 65535), p = pool.length ? pool : F; for (let t = 0; ; t++) { const f = p[Math.floor(Math.random() * p.length)]; if (Math.random() < 30 / (30 + Math.hypot(...f.p)) || t > 3) return f; } }
function flowDir(c, a, F) {
  const G = c.G, cell = CITY / G, i = cellOf(G, a.x, a.y); let best = F[i], bn = -1;
  for (const n of [i - 1, i + 1, i - G, i + G, i - G - 1, i - G + 1, i + G - 1, i + G + 1]) if (n >= 0 && n < G * G && !c.occ[n] && F[n] < best) { best = F[n]; bn = n; }
  if (bn < 0) return null;
  const dx = ((bn % G) + 0.5) * cell - CITY / 2 - a.x, dy = (Math.floor(bn / G) + 0.5) * cell - CITY / 2 - a.y, l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}
function newAnt(c) { return { x: Math.random() - 0.5, y: Math.random() - 0.5, vx: 0, vy: 0, f: pickFood(c), carry: false, v: 2.2 + Math.random() * 1.6, aggro: 0 }; }
function startAnts(h, n) {
  const c = h.city; c.ants = []; c.heat = new Float32Array(c.G * c.G); c.stock = 30; c.raiders = []; c.target = n;
  for (let k = 0; k < n; k++) { const a = newAnt(c); for (let s = Math.floor(Math.random() * 140); s > 0; s--) { const d = flowDir(c, a, c.fields[a.f.i]); if (!d) break; a.x += d[0] * 0.5; a.y += d[1] * 0.5; } c.ants.push(a); }
}
function zHit(z, dt) { z.cd = (z.cd || 0) - dt; if (z.cd <= 0) { z.cd = 0.15; return true; } return false; }
function stepCity(c, dt) {
  const G = c.G;
  for (let i = 0; i < c.heat.length; i++) c.heat[i] *= 0.994;
  for (const z of c.raiders) if (z.alive) { const d = flowDir(c, z, c.D); if (d) { z.x += d[0] * z.v * dt; z.y += d[1] * z.v * dt; } }
  const live = c.raiders.filter((z) => z.alive);
  for (const a of c.ants) {
    let tgt = null, td = 1e9; for (const z of live) { const d = Math.hypot(a.x - z.x, a.y - z.y); if (d < td) { td = d; tgt = z; } }
    if (tgt && td < 5) a.aggro = 2;
    if (tgt && td < 0.3 && tgt.hp > 1 && zHit(tgt, dt)) { a.dead = true; flashes.push({ c, x: a.x, y: a.y, t: 0.3, red: true }); continue; }
    if (tgt && td < 0.35) { tgt.hp--; if (tgt.hp <= 0 && tgt.alive) { tgt.alive = false; flashes.push({ c, x: tgt.x, y: tgt.y, t: 0 }); } }
    let dir;
    if (a.aggro > 0 && tgt) { a.aggro -= dt; const dx = tgt.x - a.x, dy = tgt.y - a.y, l = Math.hypot(dx, dy) || 1; dir = [dx / l, dy / l]; }
    else {
      a.aggro = 0;
      const F = a.carry ? c.D : c.fields[a.f.i], i = cellOf(G, a.x, a.y);
      if (F[i] <= 2) { if (a.carry) { a.carry = false; c.stock++; a.f = pickFood(c); } else if (a.f.amt > 0) { a.f.amt--; a.carry = true; } else a.f = pickFood(c); }
      dir = flowDir(c, a, a.carry ? c.D : c.fields[a.f.i]) || [Math.cos(a.x * 7 + a.y), Math.sin(a.y * 7 - a.x)];
      if (a.carry) c.heat[i] = Math.min(60, c.heat[i] + 1.2);
    }
    a.dx = dir[0]; a.dy = dir[1];
  }
  c.ants = c.ants.filter((a) => !a.dead);
  for (let n = 0; n < 6 && c.ants.length < c.target && c.stock > 0; n++) { c.stock--; c.ants.push(newAnt(c)); }
  for (const f of foodList(c)) if (f.amt < 6 + f.rich * 10 && Math.random() < dt * 0.15) f.amt++;
  const cs = 0.45, grid = new Map(), key = (x, y) => (Math.floor(x / cs) + 8192) * 16384 + Math.floor(y / cs) + 8192;
  for (const a of c.ants) { const k = key(a.x, a.y); let b = grid.get(k); if (!b) grid.set(k, (b = [])); b.push(a); }
  for (const a of c.ants) {
    let fx = a.dx * a.v * 6 - a.vx * 6, fy = a.dy * a.v * 6 - a.vy * 6;
    const crowd = Math.min(1, Math.max(0.1, (Math.hypot(a.x, a.y) - 4) / 8));
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) { const b = grid.get(key(a.x + ox * cs, a.y + oy * cs)); if (!b) continue; for (const o of b) { if (o === a) continue; const dx = a.x - o.x, dy = a.y - o.y, d2 = dx * dx + dy * dy; if (d2 > 0.1 || d2 < 1e-8) continue; const d = Math.sqrt(d2), p = (1 - d / 0.32) * 50 * crowd; if (p > 0) { fx += (dx / d) * p; fy += (dy / d) * p; } } }
    a.vx += fx * dt; a.vy += fy * dt;
    const sp = Math.hypot(a.vx, a.vy), mx = a.aggro > 0 ? 6 : 4.5; if (sp > mx) { a.vx *= mx / sp; a.vy *= mx / sp; }
    const nx = a.x + a.vx * dt, ny = a.y + a.vy * dt;
    if (!c.occ[cellOf(G, nx, ny)]) { a.x = nx; a.y = ny; } else if (!c.occ[cellOf(G, nx, a.y)]) { a.x = nx; a.vy *= 0.3; } else if (!c.occ[cellOf(G, a.x, ny)]) { a.y = ny; a.vx *= 0.3; } else { a.vx *= -0.3; a.vy *= -0.3; }
  }
}

// ---------------------------------------------------------------- caravans on the highways
let caravans = null;
function polyLen(r) { let s = 0; for (let i = 2; i < r.poly.length; i += 2) s += Math.hypot(r.poly[i] - r.poly[i - 2], r.poly[i + 1] - r.poly[i - 1]); return s; }
function cumLen(p) { const c = new Float32Array(p.length / 2); for (let i = 1; i < c.length; i++) c[i] = c[i - 1] + Math.hypot(p[i * 2] - p[i * 2 - 2], p[i * 2 + 1] - p[i * 2 - 1]); return c; }
function buildCaravans() {
  const roads = realmState.roads, n = Math.min(5000, roads.reduce((s, r) => s + Math.floor(polyLen(r) / 9), 0));

  let k = 0;

// ---------------------------------------------------------------- input
function minScale() { return realmState ? Math.min(VW, VH) / (realmState.Rw * 2.4 + 200) : 0.05; }
