<!doctype html>
<html><head><meta charset="utf-8"><title>NeoBrawl trailer compositor</title>
<style>html,body{margin:0;background:#fbfbfb}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// The trailer compositor: the plan (edit.json) cut from recorded takes, each
// shot through its own virtual camera (wide, the pair, on the killer, tight
// on the kill, a push in, a pull out), with cuts, white flashes and whip
// pans between them and the name on the drop and at the end.
// ?scale=0.333&step=4 renders a quick preview (640x360, every 4th frame).
const q = new URLSearchParams(location.search);
const S = +(q.get("scale") || 1), STEP = +(q.get("step") || 1);
const W = Math.round(1920 * S), H = Math.round(1080 * S), INK = "#111", BG = "#fbfbfb";
const c = document.getElementById("c"); c.width = W; c.height = H;
const x = c.getContext("2d");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
const smooth = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const font = new FontFace("ALCUBIERRE", "url(/assets/fonts/ALCUBIERRE.ttf)");
await font.load(); document.fonts.add(font);

const edit = await (await fetch("/rec/edit.json?" + Date.now())).json();
const metas = {};
for (const s of edit.shots) metas[s.take] ??= await (await fetch(`/rec/${s.take}/meta.json?` + Date.now())).json();

// per take: the souls in canvas pixels, smoothed tracks for the pair and each soul
const track = (pts, R) => pts.map((_, i) => {
  let sx = 0, sy = 0, w = 0;
  for (let j = Math.max(0, i - R); j <= Math.min(pts.length - 1, i + R); j++) { const k = 1 - Math.abs(j - i) / (R + 1); sx += pts[j][0] * k; sy += pts[j][1] * k; w += k; }
  return [sx / w, sy / w];
});
for (const m of Object.values(metas)) {
  const n = m.tickOf.length, sw = W / m.size[0], sh = H / m.size[1];
  const soul = [[], []], pair = [];
  const lastP = [[W / 2, H / 2], [W / 2, H / 2]];
  let lastZ = 1;
  for (let i = 0; i < n; i++) {
    const s = m.souls?.[i] || [];
    for (let k = 0; k < 2; k++) if (s[k * 3 + 2]) lastP[k] = [s[k * 3] * sw, H - s[k * 3 + 1] * sh];
    soul[0].push(lastP[0]); soul[1].push(lastP[1]);
    const [a, b] = lastP;
    if (s[2] && s[5]) lastZ = clamp(Math.min(0.55 * W / (Math.abs(a[0] - b[0]) + 1), 0.55 * H / (Math.abs(a[1] - b[1]) + 1)), 1, 1.3);
    pair.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, lastZ]);
  }
  m.soul = [track(soul[0], 8), track(soul[1], 8)];
  const pc = track(pair.map((p) => [p[0], p[1]]), 18), pz = track(pair.map((p) => [p[2], 0]), 18);
  m.pair = pc.map((p, i) => [p[0], p[1], pz[i][0]]);
}

const cache = new Map();
const frame = (take, i) => {
  const key = take + "/" + i;
  if (!cache.has(key)) {
    cache.set(key, new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = `/rec/${take}/frames/${String(i).padStart(5, "0")}.jpg`; }));
    if (cache.size > 300) cache.delete(cache.keys().next().value);
  }
  return cache.get(key);
};
const frameOfTick = (m, tick) => { const i = m.tickOf.findIndex((t) => t >= tick); return i < 0 ? m.tickOf.length - 1 : i; };
// the souls list is in player-index order: the lower index first
const slot = (who) => (who <= 4 ? 0 : 1);

// the virtual camera of a shot: centre and zoom
function camera(shot, m, fi, hitF, local) {
  const k = slot(shot.who), v = 1 - k;
  const [px, py, pz] = m.pair[fi] || [W / 2, H / 2, 1];
  const killer = m.soul[k][fi] || [px, py], at = m.soul[v][clamp(hitF - 1, 0, m.soul[v].length - 1)] || [px, py];
  const u = clamp(local / shot.dur, 0, 1), toHit = clamp(local / Math.max(0.05, shot.hitAt), 0, 1);
  switch (shot.mode) {
    case "wide": return [W / 2 + (px - W / 2) * 0.25, H / 2 + (py - H / 2) * 0.25, 1 + 0.05 * u];
    case "pair": return [px, py, pz * (1 + 0.04 * u)];
    case "killer": return [killer[0] * 0.75 + px * 0.25, killer[1] * 0.75 + py * 0.25, 1.5 + 0.06 * u];
    case "tight": return [at[0], at[1], 1.62 - 0.08 * u];
    case "push": { const e = smooth(toHit); return [px + (at[0] - px) * e, py + (at[1] - py) * e, pz + (1.55 - pz) * e]; }
    case "pull": { const e = smooth(u); return [killer[0] + (px - killer[0]) * e, killer[1] + (py - killer[1]) * e, 1.6 + (pz - 1.6) * e]; }
  }
  return [px, py, pz];
}

function spaced(text, px, y, size, track, alpha) {
  x.font = `${size}px ALCUBIERRE`; x.fillStyle = INK; x.globalAlpha = clamp(alpha, 0, 1); x.textBaseline = "middle";
  const chars = [...text], ws = chars.map((ch) => x.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + track * (chars.length - 1);
  let cx = px - total / 2;
  chars.forEach((ch, i) => { x.fillText(ch, cx, y); cx += ws[i] + track; });
  x.globalAlpha = 1;
}

async function drawShot(shot, local) {
  const m = metas[shot.take];
  const hitF = frameOfTick(m, shot.hit);
  const fi = clamp(hitF - Math.round(shot.hitAt * m.fps) + Math.round(local * m.fps), 0, m.tickOf.length - 1);
  const im = await frame(shot.take, fi);
  let [cx, cy, z] = camera(shot, m, fi, hitF, local);
  // a punch on the heavy hits only (a quick push, a little shake); a nudge on the rest
  let sx = 0, sy = 0;
  const d = local - shot.hitAt;
  if (shot.heavy && d >= 0 && d < 0.45) { const k = Math.exp(-d * 10); z *= 1 + 0.07 * k; sx = Math.sin(d * 95) * 16 * S * k; sy = Math.cos(d * 71) * 11 * S * k; }
  else if (d >= 0 && d < 0.2) z *= 1 + 0.025 * Math.exp(-d * 18);
  if (!im) return;
  const w = W * z, h = H * z;
  const ox = clamp(W / 2 - cx * z, W - w, 0), oy = clamp(H / 2 - cy * z, H - h, 0);
  x.save();
  if (shot.roll) { const r = shot.roll * Math.PI / 180 * (1 - 0.4 * clamp(local / shot.dur, 0, 1)); x.translate(W / 2, H / 2); x.rotate(r); x.scale(1.06, 1.06); x.translate(-W / 2, -H / 2); }
  if (shot.trans === "whip" && local < 0.14) {
    // a whip pan in: the frame slides in fast, smeared
    const e = 1 - ease(local / 0.14), off = e * W * 0.6;
    for (let g = 0; g < 5; g++) { x.globalAlpha = 0.28; x.drawImage(im, ox + sx + off - g * e * 40 * S, oy + sy, w, h); }
    x.globalAlpha = 1;
  } else x.drawImage(im, ox + sx, oy + sy, w, h);
  x.restore();
  if (shot.trans === "flash" && local < 0.16) { x.fillStyle = BG; x.globalAlpha = 1 - local / 0.16; x.fillRect(0, 0, W, H); x.globalAlpha = 1; }
}

async function draw(t) {
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  const shot = edit.shots.find((s) => t >= s.at && t < s.at + s.dur);
  if (shot) await drawShot(shot, t - shot.at);
  for (const k of edit.cards.filter((k) => t >= k.at && t < k.at + k.dur)) {
    const local = t - k.at;
    if (k.style === "drop") {
      // the name slams in on the drop over the kill, white behind it for a beat
      const a = local < 0.04 ? local / 0.04 : 1 - ease((local - k.dur * 0.6) / (k.dur * 0.4));
      x.fillStyle = BG; x.globalAlpha = 0.86 * a; x.fillRect(0, 0, W, H); x.globalAlpha = 1;
      const s = 1 + 0.18 * Math.exp(-local * 12);
      x.save(); x.translate(W / 2, H / 2); x.scale(s, s);
      spaced("NEOBRAWL", 0, 0, 150 * S, (46 + 30 * local) * S, a);
      x.restore();
    } else {
      x.fillStyle = BG; x.globalAlpha = ease(local / 0.6); x.fillRect(0, 0, W, H); x.globalAlpha = 1;
      spaced(k.text, W / 2, H / 2 - 18 * S, 128 * S, (70 - 28 * ease(local / 1.2) + 4 * local) * S, ease((local - 0.15) / 0.5));
      if (k.sub) spaced(k.sub, W / 2, H / 2 + 96 * S, 32 * S, 10 * S, 0.75 * ease((local - 0.8) / 0.6));
    }
  }
}

window.render = async (from = 0, to = edit.length, out = edit.out || "trailer") => {
  let n = 0;
  for (let f = Math.round(from * edit.fps); f < Math.round(to * edit.fps); f += STEP) {
    await draw(f / edit.fps);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", S < 1 ? 0.8 : 0.95));
    await fetch(`/frame?i=${n++}&take=${out}`, { method: "POST", body: blob });
  }
  return n;
};
window.ready = true;
</script></body></html>
