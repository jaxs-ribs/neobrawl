[package]
name = "neobrawl"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ggrs = "0.11"
bincode = "1.3"
instant = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ggrs = { version = "0.11", features = ["wasm-bindgen"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
