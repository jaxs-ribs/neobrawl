<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NeoBrawl</title>
<style>
  :root { --bg: #fbfbfb; --fg: #111; --dim: #777; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 14px/1.4 system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #overlay[hidden] { display: none; }
  #overlay h1 { font-weight: 300; letter-spacing: .4em; margin: 0 0 .5em; }
  #overlay p { color: var(--dim); margin: .25em 0; }
  #help { position: fixed; right: 12px; bottom: 10px; font-size: 12px; color: var(--dim); text-align: right; pointer-events: none; }
  #help kbd { font: 11px ui-monospace, monospace; border: 1px solid #ccc; border-radius: 3px; padding: 0 3px; }
  #practice { position: fixed; top: 18px; left: 0; right: 0; text-align: center; pointer-events: none;
    font: 300 30px/1 var(--font, system-ui), sans-serif; letter-spacing: .3em; color: #111; }
  #practice #hits { display: inline-block; transition: transform .25s cubic-bezier(.2,1.8,.4,1); }
  #practice #hits.tick { transform: scale(1.35); transition: none; }
  #practice #streak { margin-left: .4em; font-size: 13px; color: #888; letter-spacing: .1em; vertical-align: top; }
  #debug { position: fixed; left: 8px; top: 8px; font: 11px/1.35 ui-monospace, monospace; color: #070;
    background: #fffd; padding: 6px 8px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="overlay"><div><h1>NEOBRAWL</h1><p id="status">loading…</p></div></div>
<div id="help">P1 <kbd>WASD</kbd> move · point the cursor at your target · hold click or <kbd>Space</kbd> to charge, release to throw · <kbd>Shift</kbd> dash<br>
P2 controller (sticks, <kbd>A</kbd> dash) or <kbd>←↑↓→</kbd> + <kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> aim + right <kbd>Shift</kbd> dash · <kbd>Esc</kbd> pause</div>
<div id="debug" hidden></div>
<div id="practice" hidden><span id="hits">0</span><span id="streak"></span></div>
<script type="module" src="./main.js?v=33747b6674"></script>
</body>
</html>
