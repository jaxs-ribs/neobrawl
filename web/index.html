<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NeoBrawl</title>
<style>
  :root { --bg: #fbfbfb; --fg: #111; --dim: #777; }
  /* no rubber-band bounce and no two-finger swipe back/forward (Chrome) */
  html, body { overscroll-behavior: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 14px/1.4 system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #overlay[hidden] { display: none; }
  #overlay h1 { font-weight: 300; letter-spacing: .4em; margin: 0 0 .5em; }
  #overlay p { color: var(--dim); margin: .25em 0; }
  /* title-screen corner: the controls legend and the aim setting, nothing in play */
  #help { position: fixed; left: 16px; bottom: 14px; font-size: 11px; line-height: 1.7; color: #999; pointer-events: none; max-width: calc(100vw - 32px); }
  #help[hidden] { display: none; }
  #help kbd { font: 10px ui-monospace, monospace; border: 1px solid #ddd; border-radius: 3px; padding: 0 3px; color: #777; }
  #help button { pointer-events: auto; border: 0; background: none; padding: 0; margin: 0 0 4px; cursor: pointer; font: inherit; color: #777; }
  #help button:hover { color: #111; }
  #help b { font-weight: 500; color: #666; }
  #practice { position: fixed; top: 18px; left: 0; right: 0; text-align: center; pointer-events: none;
    font: 300 30px/1 var(--font, system-ui), sans-serif; letter-spacing: .3em; color: #111; }
  #practice #hits { display: inline-block; transition: transform .25s cubic-bezier(.2,1.8,.4,1); }
  #practice #hits.tick { transform: scale(1.35); transition: none; }
  #practice #streak { margin-left: .4em; font-size: 13px; color: #888; letter-spacing: .1em; vertical-align: top; }
  #debug { position: fixed; left: 8px; top: 8px; font: 11px/1.35 ui-monospace, monospace; color: #070;
    background: #fffd; padding: 6px 8px; white-space: pre; pointer-events: none; }
  #lag { position: fixed; right: 12px; top: 10px; text-align: right; pointer-events: none;
    font: 11px/1.5 ui-monospace, monospace; color: #333; }
  #lag[hidden] { display: none; }
  #lag .l3 { color: var(--dim); }
  #lag canvas { display: block; margin: 3px 0 2px auto; opacity: .7; }
  #lagbanner { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; pointer-events: none;
    font: 13px/1.4 ui-monospace, monospace; color: #111; opacity: 0; transform: translateY(6px);
    transition: opacity .35s, transform .35s cubic-bezier(.2,1.4,.4,1); padding: 0 16px; }
  #lagbanner.on { opacity: 1; transform: none; }
  /* the mode row: under the start stack, on the title screen only */
  #menuextra { position: fixed; left: 0; right: 0; top: 66%; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; padding: 0 16px; }
  #menuextra[hidden] { display: none; }
  #menuextra button { border: 0; background: none; font: 300 14px/1 var(--font, system-ui), sans-serif; letter-spacing: .32em; color: #666;
    cursor: pointer; padding: 10px 14px; transition: color .2s, letter-spacing .35s cubic-bezier(.2,1.4,.4,1); }
  #menuextra button:hover, #menuextra button:focus-visible { color: #111; letter-spacing: .4em; outline: none; }
  #menuextra button + button::before { content: "·"; color: #ccc; margin-right: 26px; letter-spacing: 0; }
  /* online: a toast while playing; a full veil with one card while setting up */
  #online { position: fixed; left: 0; right: 0; top: 14%; text-align: center; pointer-events: none; padding: 0 16px;
    font: 300 15px/1.6 var(--font, system-ui), sans-serif; letter-spacing: .08em; color: #111;
    opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .4s cubic-bezier(.2,1.4,.4,1); }
  #online.on { opacity: 1; transform: none; }
  #online.sticky { inset: 0; top: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fbfbfbf0; }
  #online.sticky:not(.on) { visibility: hidden; }
  #online.sticky.on { pointer-events: auto; }
  #online p { margin: .35em 0; }
  #online .big { font-size: 22px; letter-spacing: .3em; margin-bottom: .8em; }
  #online .dim { color: #888; font-size: 12px; }
  #online .link { font: 13px ui-monospace, monospace; word-break: break-all; padding: 10px 14px; border: 1px solid #ddd; border-radius: 4px; background: #fff; margin: .6em 0; cursor: copy; }
  #online .acts { margin-top: 1.4em; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #online button { pointer-events: auto; font: 300 13px/1 var(--font, system-ui), sans-serif; letter-spacing: .25em; border: 1px solid #ccc; background: #fff; color: #111; border-radius: 3px; padding: 10px 18px; cursor: pointer; }
  #online button:hover { border-color: #111; }
  #online button.main { background: #111; color: #fbfbfb; border-color: #111; }
  #online kbd { font: 11px ui-monospace, monospace; border: 1px solid #ccc; border-radius: 3px; padding: 0 3px; }
  /* anthill: a quiet top line, a number on each stacker, the win */
  #anthud { position: fixed; top: 16px; left: 0; right: 0; text-align: center; pointer-events: none;
    font: 300 13px/1 var(--font, system-ui), sans-serif; letter-spacing: .3em; color: #555; }
  #anthud b { font-weight: 400; color: #111; }
  #antlabels span { position: fixed; transform: translate(-50%, -50%); pointer-events: none;
    font: 300 15px/1 var(--font, system-ui), sans-serif; letter-spacing: .1em; color: #111; transition: opacity .4s; }
  #antlabels span.gone { opacity: .2; }
  #antlabels span.tick { animation: anttick .35s cubic-bezier(.2,1.8,.4,1); }
  @keyframes anttick { from { transform: translate(-50%, -50%) scale(1.5); } }
  #antwin { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fbfbfbd8;
    font: 300 15px/1.7 var(--font, system-ui), sans-serif; letter-spacing: .1em; color: #111; text-align: center; }
  #antwin[hidden] { display: none; }
  #antwin .big { font-size: 22px; letter-spacing: .3em; margin-bottom: .6em; }
  #antwin .dim { color: #888; font-size: 12px; }
  #antmarks i { position: fixed; width: 0; height: 0; border: 6px solid transparent; border-left: 10px solid #2a52be; pointer-events: none; transform-origin: 0 50%; opacity: .7; }
  #antmarks i.wind { border-left-color: #c22; opacity: 1; }
  #antmarks i.nest { border-left-color: #111; opacity: .45; }
  #nethud { position: fixed; right: 12px; top: 10px; font: 11px ui-monospace, monospace; color: #999; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="overlay"><div><h1>NEOBRAWL</h1><p id="status">loading…</p></div></div>
<div id="help"><button id="aimbtn">aim: mouse</button><br>
<b>move</b> <kbd>WASD</kbd> · <b>aim</b> the pointer · <b>charge</b> hold <kbd>Space</kbd> or click, let go to throw · <b>dash</b> <kbd>Shift</kbd> · <kbd>Esc</kbd> pause<br>
a second player takes over the bot with a controller, or <kbd>←↑↓→</kbd> + <kbd>IJKL</kbd> and right <kbd>Shift</kbd></div>
<div id="menuextra"><button id="botbtn">play the bot</button><button id="practicebtn">target practice</button><button id="antbtn">anthill</button></div>
<div id="ants" hidden><div id="anthud"></div><div id="antlabels"></div><div id="antmarks"></div><div id="antwin" hidden></div></div>
<div id="debug" hidden></div>
<div id="practice" hidden><span id="hits">0</span><span id="streak"></span></div>
<script type="module" src="./main.js?v=767bd6ce77"></script>
</body>
</html>
